# alpine-3.24: Alpine Linux 3.24 (musl, OpenRC) as a Zode image. Read by
# scripts/build-base.sh; the weekly refresh workflow moves the pin and opens
# the next release's line when Alpine ships its cloud image.
DISTRO_NAME="Alpine Linux 3.24"
INIT=openrc
CLOUD_IMAGE_URL=https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/generic_alpine-3.24.1-x86_64-uefi-cloudinit-r0.qcow2
CLOUD_IMAGE_SUM=sha512:ed976ef40de1f73adcb0a3b253ec9e73e43c408208fcc3c30dcdf7a69b91a387a4777f88c6b72345123edf3832d7cb49403ecce28ec84d496d4b3bad6fbd0923
# No browser or desktop switch: zode-desktop drives systemd units and voxl is
# a glibc build. Chromium is installed for headless use from a shell.
FEATURES="exec fork docker"
